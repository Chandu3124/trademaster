<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | TradeMasters</title>

    <meta name="description" content="The page you are looking for could not be found on TradeMasters.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@0.542.0/dist/umd/lucide.min.js" defer></script>

    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="error.css">
</head>

<body>

    <main class="page">

        <div class="top-actions">
            <button type="button" class="icon-button js-rtl-toggle"
                aria-label="Switch text direction" title="Switch text direction">
                <i data-lucide="arrow-left-right"></i>
            </button>

            <button type="button" class="icon-button js-theme-toggle"
                aria-label="Switch to dark mode" title="Toggle dark mode">
                <i data-lucide="moon"></i>
            </button>
        </div>

        <section class="card" aria-labelledby="errorTitle">

            <a href="index.html" class="brand error-brand" aria-label="TradeMasters Home">
                <img
                    src="logo_light.png"
                    alt="TradeMasters Logo"
                    class="brand-logo"
                    id="brandLogo"
                >

                <span class="brand-text">
                    <span class="brand-title">
                        <span class="brand-trade">TRADE</span><span class="brand-masters">MASTERS</span>
                    </span>

                    <span class="brand-subtitle">
                        STOCK MARKET TRADING ACADEMY
                    </span>
                </span>
            </a>

            <div class="code">404</div>

            <h2 id="errorTitle">Page Not Found</h2>

            <p>
                Sorry, the page you are looking for doesn’t exist or may have been moved.
            </p>

            <div class="actions">
                <a href="index.html" class="btn btn-primary">
                    Go Home
                    <i data-lucide="arrow-right"></i>
                </a>

                <a href="contact.html" class="btn btn-secondary">
                    Contact Us
                    <i data-lucide="mail"></i>
                </a>
            </div>

        </section>
    </main>

    <script src="main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
    /* main.js handles:
       - RTL/LTR toggle
       - Dark/light theme toggle
       - Logo light/dark switching
       - localStorage sync
       - Lucide icons
    */

    function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
            window.lucide.createIcons();
        }
    }

    refreshIcons();
});
    </script>
</body>
</html>
